name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed content
        run: npx prettier --write docs/wanted-overload.md src/game/session/mvpRun.test.ts src/game/session/wantedPressure.test.ts
      - name: Commit canonical formatting
        run: |
          if ! git diff --quiet -- docs/wanted-overload.md src/game/session/mvpRun.test.ts src/game/session/wantedPressure.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/wanted-overload.md src/game/session/mvpRun.test.ts src/game/session/wantedPressure.test.ts
            git commit -m "style: apply canonical prettier formatting"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Lint, unit tests, build and formatting
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Combat interaction regression tests
        run: npm run test:e2e -- tests/e2e/pause.spec.ts tests/e2e/breakthrough.spec.ts tests/e2e/combat-core.spec.ts tests/e2e/battlefield-objective.spec.ts
        env:
          CAPTURE_UI_REVIEW: '1'
      - name: Save interaction report and review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: combat-interaction-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
