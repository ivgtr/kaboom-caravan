name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, unit tests, build and formatting
        run: |
          npm run lint
          npm run test
          npm run build
          npm run format
          git diff --exit-code
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Combat interaction regression tests
        run: npm run test:e2e -- tests/e2e/pause.spec.ts tests/e2e/breakthrough.spec.ts tests/e2e/combat-core.spec.ts tests/e2e/battlefield-objective.spec.ts
        env:
          CAPTURE_UI_REVIEW: '1'
      - name: Save interaction report and review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: combat-interaction-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
