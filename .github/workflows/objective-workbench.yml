name: Objective verification
on:
  push:
    branches: [codex/battlefield-objectives]
    paths: [.github/workflows/objective-workbench.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/codex/battlefield-objectives'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/battlefield-objectives
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Apply verified patch and remove staging files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = [pathlib.Path(f'.objective-patch.{i}') for i in range(1, 4)]
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          assert hashlib.sha256(patch).hexdigest() == 'cf28d1e0b420265496751f871562dbe988e7007317f24a89fe1f6d322aa29576'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          p = pathlib.Path('tests/e2e/battlefield-objective.spec.ts')
          s = p.read_text().replace('    browser,\n  }, testInfo)', '    browser,\n    baseURL,\n  }, testInfo)')
          s = s.replace('    const context = await browser.newContext({\n', '    const context = await browser.newContext({\n      baseURL,\n')
          p.write_text(s)
          for p in parts:
              p.unlink()
          pathlib.Path('.github/workflows/objective-workbench.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: turn route detours into battlefield capture objectives'
          git push origin HEAD:refs/heads/codex/battlefield-objectives
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Browser regression and responsive review
        run: npm run test:e2e -- tests/e2e/pause.spec.ts tests/e2e/breakthrough.spec.ts tests/e2e/combat-core.spec.ts tests/e2e/battlefield-objective.spec.ts --workers=2 --retries=0
        env:
          CAPTURE_UI_REVIEW: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: battlefield-objective-review
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
