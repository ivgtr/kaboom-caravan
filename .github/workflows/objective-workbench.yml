name: Objective workbench
on:
  push:
    branches: [codex/battlefield-objectives]
    paths: [.github/workflows/objective-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package source and installed tools without credentials
        run: |
          mkdir -p /tmp/objective-workbench
          git archive HEAD | tar -x -C /tmp/objective-workbench
          rm -rf /tmp/objective-workbench/artifacts /tmp/objective-workbench/.frontend-review
          cp -a node_modules /tmp/objective-workbench/
          cp "$(command -v node)" /tmp/objective-workbench/node24
          tar -czf /tmp/objective-workbench.tar.gz -C /tmp/objective-workbench .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: objective-workbench
          path: /tmp/objective-workbench.tar.gz
          retention-days: 1
