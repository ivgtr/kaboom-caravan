name: Siege workspace verification snapshot
on:
  push:
    branches: [codex/rogue-siege-caravan]
    paths: [.github/workflows/siege-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci
      - name: Package source and exact dependencies for isolated verification
        shell: bash
        run: |
          tar --exclude=.git --exclude=artifacts --exclude=.frontend-review -czf "$RUNNER_TEMP/workspace.tar.gz" .
          test $(stat -c%s "$RUNNER_TEMP/workspace.tar.gz") -gt 100000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siege-workspace
          path: ${{ runner.temp }}/workspace.tar.gz
          retention-days: 1
