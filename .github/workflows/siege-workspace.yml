name: Siege workspace verification snapshot
on:
  push:
    branches: [codex/rogue-siege-caravan]
    paths: [.github/workflows/siege-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package tracked source for isolated local verification
        run: git archive HEAD -- src public tests docs .github package.json package-lock.json index.html vite.config.ts vitest.config.ts playwright.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json eslint.config.js .prettierrc.json .prettierignore README.md | gzip > "$RUNNER_TEMP/workspace.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siege-workspace
          path: ${{ runner.temp }}/workspace.tar.gz
          retention-days: 1
