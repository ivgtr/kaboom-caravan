name: PR gameplay validation

on:
  pull_request:
    branches: [main]
    paths: ['.github/apply_frontline.py']

permissions:
  contents: read

concurrency:
  group: gameplay-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'codex/frontline-breakthrough' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Apply source edits with before and after hash validation
        run: |
          python .github/apply_frontline.py
          tar -czf /tmp/frontline-source.tar.gz src README.md tests/e2e/breakthrough.spec.ts
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Browser interactions and visual review
        run: npm run test:e2e -- tests/e2e/pause.spec.ts tests/e2e/breakthrough.spec.ts
        env:
          CAPTURE_UI_REVIEW: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontline-browser-review
          path: |
            test-results/
            playwright-report/
            /tmp/frontline-source.tar.gz
          retention-days: 3
          if-no-files-found: ignore
      - name: Commit validated changes to the PR branch only
        run: |
          git add src README.md
          git rm .github/apply_frontline.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate frontline breakthrough with combat, input and run progression'
          git push origin HEAD:refs/heads/codex/frontline-breakthrough
