name: PR validation workspace

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace:
    if: github.head_ref == 'codex/frontline-breakthrough'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package tracked source and locked dependencies for isolated validation
        run: |
          git archive --format=tar HEAD -o /tmp/source.tar
          tar -cf /tmp/dependencies.tar node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: pr-validation-workspace
          path: |
            /tmp/source.tar
            /tmp/dependencies.tar
          retention-days: 1
