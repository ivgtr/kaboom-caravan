name: Temporary development workspace

on:
  push:
    branches: [codex/run-defining-upgrades]
    paths: [.github/workflows/workspace-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package public source and installed dependencies for isolated tests
        run: |
          git archive --format=tar HEAD > /tmp/workspace.tar
          tar -rf /tmp/workspace.tar node_modules
          gzip /tmp/workspace.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-workspace
          path: /tmp/workspace.tar.gz
          retention-days: 1
